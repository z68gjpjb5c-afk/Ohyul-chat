<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메신저 대화</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f2f4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#222}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#aebbc1;display:flex;flex-direction:column}
.top{background:#f8f8f8;padding:12px 16px;display:flex;justify-content:space-between;font-size:12px}
.head{background:#f8f8f8;padding:14px 15px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e5e5e5}
.back{font-size:27px}.person{flex:1}.person b{font-size:15px}.person small{display:block;color:#888;margin-top:3px}
.chat{height:calc(100vh - 150px);min-height:390px;overflow-y:auto;padding:15px 12px;display:flex;flex-direction:column;gap:12px}
.date{text-align:center;margin-bottom:5px}.date span{background:#87969b;color:white;border-radius:8px;padding:5px 10px;font-size:11px}
.bubble{max-width:84%;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#fae58b}.theirs{align-self:flex-start;background:white}
.note{align-self:center;background:#738187;color:white;border-radius:9px;padding:8px 12px;font-size:11px;text-align:center;max-width:95%}
.typing{align-self:flex-start;background:white;border-radius:13px;padding:12px 16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;background:#999;border-radius:50%;animation:dot .8s infinite alternate}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{to{opacity:.2;transform:translateY(-4px)}}
.composer{background:#f7f7f7;padding:12px;position:sticky;bottom:0}
.row{display:flex;align-items:center;gap:8px}
input{min-width:0;flex:1;border:1px solid #ddd;border-radius:24px;padding:13px 15px;font-size:14px;background:white;outline:none}
button{border:0;border-radius:50%;width:44px;height:44px;background:#fae58b;font-size:21px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.status{display:flex;justify-content:space-between;align-items:center;color:#888;font-size:11px;margin-top:8px}
.reset{background:none;border:0;border-radius:0;width:auto;height:auto;font-size:11px;color:#777;text-decoration:underline;padding:0}
.disclaimer{text-align:center;color:#65747a;font-size:10px;padding:0 12px 10px;background:#aebbc1}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><b>11:08</b><span>● ◉ ▰</span></div>
 <div class="head"><span class="back">‹</span><div class="person"><b>철수책상철책상</b><small>온라인</small></div><span>⌕　☰</span></div>
 <main id="chat" class="chat"><div class="date"><span>2026년 11월 17일 화요일</span></div></main>
 <div class="composer">
  <div class="row"><span style="font-size:22px;color:#888">＋</span><input id="msg" placeholder="메시지 입력" disabled aria-label="메시지 입력"><button id="send" disabled aria-label="메시지 보내기">➤</button></div>
  <div class="status"><span id="status">대화를 시작합니다.</span><button class="reset" id="reset">처음부터</button></div>
 </div>
 <div class="disclaimer">팬 창작용 가상 메신저 화면입니다. 실제 카카오톡과 무관합니다.</div>
</div>
<script>
(()=>{
const chat=document.getElementById('chat'),input=document.getElementById('msg'),send=document.getElementById('send'),status=document.getElementById('status'),reset=document.getElementById('reset');
const events=[
{t:'me',s:'철수야 자니?'},
{t:'other',s:'씨발 뭐야. 뭔 전남친인줄 왜 연락했는데'},
{t:'note',s:'오율은 잠시 화면을 바라보다가 조심스럽게 답했다.'},
{t:'me',s:'아니 다름이 아니라…… 내가 요즘 많이 외로운가 봐'},
{t:'other',s:'갑자기 뭔 소리야 이 새끼는 술마심?'},
{t:'note',s:'몇 초 동안 고민하던 오율은 결국 본론을 꺼냈다.'},
{t:'me',s:'너 주변에 괜찮은 남자 없냐?'},
{t:'other',s:'안 그래도 내가 다니는 복싱장에 어떤 동생이 있는데'},
{t:'other',s:'걔가 저번에 네가 나 데리러 왔을 때 너 보고 마음에 든다고 했었음 ㅇㅇ'},
{t:'other',s:'그 새끼 존나 예쁘장? 하게 생김'},
{t:'me',s:'야 좋다.'},
{t:'me',s:'내가 지금 누굴 가릴 처지가 아니야.'},
{t:'other',s:'새끼발정났노. 연락처 넘겨줄 테니까 연락해봐'},
{t:'other',s:'010-2006-0918'}
];
let idx=0,token=0,ready=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function scroll(){chat.scrollTop=chat.scrollHeight}
function add(type,text){const el=document.createElement('div');el.className=type==='note'?'note':'bubble '+(type==='me'?'mine':'theirs');el.textContent=text;chat.appendChild(el);scroll()}
function enable(on){ready=on;input.disabled=!on;send.disabled=!on}
function indicator(){const el=document.createElement('div');el.className='typing';for(let i=0;i<3;i++)el.appendChild(document.createElement('i'));chat.appendChild(el);scroll();return el}
async function run(){
 const my=token;
 if(idx>=events.length){input.value='';enable(false);status.textContent='대화가 끝났습니다.';return}
 const e=events[idx];
 if(e.t==='note'){
  enable(false);input.value='';status.textContent='';
  await wait(450);if(my!==token)return;
  add('note',e.s);idx++;
  await wait(1400);if(my!==token)return;
  run();return;
 }
 if(e.t==='other'){
  enable(false);input.value='';status.textContent='철수가 입력 중…';
  const dots=indicator();await wait(3000);if(my!==token)return;
  dots.remove();add('other',e.s);idx++;
  await wait(450);if(my!==token)return;run();return;
 }
 enable(false);input.value='';status.textContent='오율이 메시지를 입력하고 있어요…';
 for(const ch of Array.from(e.s)){
  if(my!==token)return;
  input.value+=ch;await wait(110);
 }
 if(my!==token)return;
 enable(true);status.textContent='종이비행기를 눌러 메시지를 보내세요.';
}
function transmit(){
 if(!ready||idx>=events.length)return;
 const e=events[idx];if(e.t!=='me'||input.value!==e.s)return;
 add('me',e.s);input.value='';idx++;enable(false);status.textContent='';run();
}
send.addEventListener('click',transmit);
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();transmit()}});
reset.addEventListener('click',()=>{token++;idx=0;ready=false;input.value='';enable(false);chat.innerHTML='<div class="date"><span>2026년 11월 17일 화요일</span></div>';status.textContent='대화를 처음부터 시작합니다.';run()});
run();
})();
</script>
</body>
</html>
